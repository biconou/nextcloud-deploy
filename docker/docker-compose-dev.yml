version: '3.7'

services:
  db:
    image: mariadb:10.6
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/${PROFILE}/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=nextcloud
    ports:
      - "3306:3306"
    env_file:
      - db.env
    networks:
      - nextcloud
 
  nextcloud:
    build:
      context: nc/
      args:
        NC_IMAGE: ${NC_IMAGE}
    ports:
      - 80:80
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/${PROFILE}/nextcloud:/var/www/html:z
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      - MYSQL_HOST=db
#      - OVERWRITEPROTOCOL=https
#      - OVERWRITEWEBROOT=/nextcloud-dev
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
    env_file:
      - db.env
    depends_on:
      - db
    networks:
      - nextcloud
      - elk-net


  cron:
    build:
      context: nc/
      args:
        NC_IMAGE: ${NC_IMAGE}
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/${PROFILE}/nextcloud:/var/www/html:z
      # NOTE: The `volumes` config of the `cron` and `app` containers must match
    entrypoint: /cron.sh
    depends_on:
      - db
    networks:
      - nextcloud


networks:
  nextcloud:
    driver: bridge
  elk-net:
    external: true
    name: elk_elk